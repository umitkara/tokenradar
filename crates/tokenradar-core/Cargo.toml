[package]
name = "tokenradar-core"
description = "Domain, storage, indexing and limit engine for TokenRadar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tokenradar-i18n.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
simd-json = "0.18.1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bench]]
name = "parse"
harness = false
