[package]
name = "tokenradar-cli"
description = "TokenRadar command-line interface and Claude Code statusline bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "tokenradar"
path = "src/main.rs"

[dependencies]
tokenradar-core.workspace = true
tokenradar-i18n.workspace = true
lexopt.workspace = true
serde_json = "1.0.154"

# `path add|remove`: the user PATH in the registry and the change broadcast (Step 12). Already in
# the graph through the core.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
