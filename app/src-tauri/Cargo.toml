[package]
name = "tokenradar-app"
description = "TokenRadar desktop app: tray icon, panel and windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tokenradar-core.workspace = true
tokenradar-i18n.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# Raw WebView2 access for the Step 02 lifecycle spike. Same versions as wry's, so the COM types match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Tray: local time, icon size (DPI), taskbar theme, high contrast and the change watcher window.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Compiles the Step 02 measurement scenario (`TOKENRADAR_SPIKE`) into release builds.
spike = []

[lints]
workspace = true

[dev-dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
