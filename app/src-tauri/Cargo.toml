[package]
name = "tokenradar-app"
description = "TokenRadar desktop app: tray icon, panel and windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tokenradar-core.workspace = true
tokenradar-i18n.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true

# Raw WebView2 access for the Step 02 lifecycle spike. Same versions as wry's, so the COM types match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Local time for the temporary Step 05 tray tooltip.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }

[features]
# Compiles the Step 02 measurement scenario (`TOKENRADAR_SPIKE`) into release builds.
spike = []

[lints]
workspace = true
