[package]
name = "tokenradar-app"
description = "TokenRadar desktop app: tray icon, panel and windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tokenradar-core.workspace = true
tokenradar-i18n.workspace = true
tauri.workspace = true
tauri-plugin-single-instance.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
# Panel timers (warm TTL, ready timeout) on Tauri's runtime; already in the graph through the core.
tokio = { version = "1.54.1", default-features = false, features = ["time"] }
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2.7"
# Folder picker (Claude Code directory) and save dialog (diagnostics bundle); called from Rust
# only, the frontend gets no dialog permission (Step 11b).
tauri-plugin-dialog = "2.8"
# Opens the allowlisted links (About) and shows the diagnostics bundle in Explorer; Rust only.
tauri-plugin-opener = "2.7"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }

# Raw WebView2 access: the hidden panel's memory level and the Step 02 spike. Same versions as
# wry's, so the COM types match.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# Tray: local time, icon size (DPI), taskbar theme, high contrast and the change watcher window.
# Panel: monitor work area, taskbar edge and rounded corners.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Compiles the Step 02 measurement scenario (`TOKENRADAR_SPIKE`) into release builds.
spike = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
