name: Bug report
description: Something in TokenRadar does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste tokens, conversation content or anything from `.credentials.json`.
        Security problems go to the private report form instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: TokenRadar version
      description: Settings → About, or `tokenradar --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options: [Installer, winget, Scoop, Portable zip, Built from source]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: source
    attributes:
      label: Limit source
      description: Shown next to the numbers in the panel.
      options: [Statusline, Usage API, Estimate (≈), Not sure]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: |
        If you can, run `tokenradar doctor` (or Settings → Privacy & data → Create diagnostics bundle),
        check the zip and attach it here. It holds no tokens, conversation content, project names or readable paths.
