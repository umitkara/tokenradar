name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and test
        run: pnpm check:all

      - name: NSIS template matches tauri-cli
        run: node scripts/check-nsis-template.mjs

      # The installer without updater artifacts: no signing key needed (release.yml signs).
      - name: Release build
        run: pnpm tauri build

      # The release build above ran `pnpm build`, so app/dist holds the production bundle.
      - name: Bundle budget
        run: node scripts/check-bundle-size.mjs

      - name: Portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1

  audit:
    name: JS advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm audit --audit-level high

  deny:
    name: Dependency policy
    # cargo-deny-action is a container action, so it needs a Linux runner.
    # deny.toml pins the Windows targets, so the analysed graph is the same.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
