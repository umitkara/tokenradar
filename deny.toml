# cargo-deny configuration. Run with `pnpm deny` (or `cargo deny check`).

[graph]
# The app ships on Windows first; macOS and Linux join in v0.5 (ADR-021).
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained (archived, no known vulnerability). It is a compile-time macro crate
    # pulled in by tauri and specta, so nothing of it runs in the shipped binaries. Drop this when
    # they move to a fork (Step 12).
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro crate from tauri and specta; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: entries may be unused at any given time.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Permissive, no attribution required in binaries (xxhash-rust, the dedup key hash).
    "BSL-1.0",
    # Public-domain dedication, no conditions at all (notify, the file watcher).
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # File-level copyleft only: modified MPL files must stay MPL, the rest of the app is unaffected.
    "MPL-2.0",
    # Fonts only (embedded reading font, Step 09).
    "OFL-1.1",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
