[workspace]
resolver = "3"
members = [
    "crates/tokenradar-core",
    "crates/tokenradar-i18n",
    "crates/tokenradar-cli",
    "app/src-tauri",
]
# Patched third-party sources (vendor/README.md) are not ours to lint or format.
exclude = ["vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/umitkara/tokenradar"
authors = ["Ümit Kara"]
publish = false

[workspace.dependencies]
tokenradar-core = { path = "crates/tokenradar-core" }
tokenradar-i18n = { path = "crates/tokenradar-i18n" }

lexopt = "0.3"

tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-single-instance = "2.5"

[patch.crates-io]
# Idle watcher woke 10 times a second on Windows (ADR-038). Remove once upstream waits without a
# timeout.
notify = { path = "vendor/notify" }

[workspace.lints.rust]
# Crates that need Windows FFI opt out locally with `#![allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Noisy pedantic lints that add little for an application codebase.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Full debuginfo made `target/debug` grow to ~100 GB (PDBs plus incremental caches). Line
# tables keep file:line in backtraces and panics; dependencies carry no debuginfo at all.
# Use `scripts/trim-target.ps1` to drop stale artifacts once the directory gets large.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Built for size, except the budgeted hot paths (indexer, queries, limit engine, SQLite, JSON
# parsing), which stay at full speed. At `opt-level = 3` throughout the app reached 16.05 MiB
# against its 15 MB budget (Step 17b, ADR-072).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.tokenradar-core]
opt-level = 3

[profile.release.package.rusqlite]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

# The CLI is size-bound (≤ 3 MB) and its hot path is short (statusline p95 < 30 ms), so it is
# built for size: `cargo build --profile release-cli -p tokenradar-cli` (Step 11b).
[profile.release-cli]
inherits = "release"
opt-level = "s"

[profile.release-cli.package.tokenradar-core]
opt-level = "s"

[profile.release-cli.package.rusqlite]
opt-level = "s"

[profile.release-cli.package.libsqlite3-sys]
opt-level = "s"

[profile.release-cli.package.serde_json]
opt-level = "s"

[profile.release-cli.package.memchr]
opt-level = "s"
