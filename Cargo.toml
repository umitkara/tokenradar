[workspace]
resolver = "3"
members = [
    "crates/tokenradar-core",
    "crates/tokenradar-i18n",
    "crates/tokenradar-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/umitkara/TokenRadar"
authors = ["Ümit Kara"]
publish = false

[workspace.dependencies]
tokenradar-core = { path = "crates/tokenradar-core" }
tokenradar-i18n = { path = "crates/tokenradar-i18n" }

lexopt = "0.3"

tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-single-instance = "2.5"

[workspace.lints.rust]
# Crates that need Windows FFI opt out locally with `#![allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Noisy pedantic lints that add little for an application codebase.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Step 02 measures size vs. speed; `opt-level = "s"` is the alternative to evaluate.
